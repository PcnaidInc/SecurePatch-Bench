name: Benchmark bug
about: Report a reproducibility, runner, manifest, or documentation problem
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not disclose live credentials or unpublished third-party vulnerabilities here. Use SECURITY.md for sensitive reports."
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Node, operating system, architecture, and relevant command output.
