name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck, test, validate, and verify committed pilot artifacts
        run: npm run ci
      - name: Confirm validation did not rewrite committed reports
        run: git diff --exit-code -- docs/pilot-results.json docs/PILOT_RESULTS.md
